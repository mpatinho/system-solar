# Configuración común de la web (se incluye en los servidores HTTP y HTTPS).
root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Certificado de la CA local, para instalarlo en el ordenador del niño y no ver avisos.
location = /ca.crt {
  alias /etc/nginx/certs/ca.crt;
  default_type application/x-x509-ca-cert;
  add_header Content-Disposition 'attachment; filename="sistema-solar-ca.crt"';
}
location /textures/ {
  expires 30d;
  add_header Cache-Control "public, immutable";
}
location /assets/ {
  expires 30d;
  add_header Cache-Control "public, immutable";
}
location / {
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache";
}
